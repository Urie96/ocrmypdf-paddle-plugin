[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmypdf-rapidocr"
version = "0.3.0"
description = "RapidOCR (PP-OCRv6) engine plugin for OCRmyPDF"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ocrmypdf-rapidocr contributors" }]
keywords = ["ocr", "ocrmypdf", "rapidocr", "pp-ocrv6", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "ocrmypdf>=14.0.0",
    "rapidocr>=3.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
# Needed for the actual inference: rapidocr can drive several backends, but
# onnxruntime is the only one that does not drag in paddlepaddle/torch.
onnxruntime = ["onnxruntime>=1.16"]

[project.urls]
Homepage = "https://github.com/Urie96/ocrmypdf-paddle-plugin"
Issues = "https://github.com/Urie96/ocrmypdf-paddle-plugin/issues"
Source = "https://github.com/clefru/ocrmypdf-paddleocr"

# The entry point name must NOT be an importable module name: `--plugin NAME`
# does importlib.import_module(NAME) and pluggy refuses to register two plugins
# under the same name, so a name like "rapidocr" (which is also the library
# module) would make `ocrmypdf --plugin rapidocr` abort.  The plugin is loaded
# automatically through this entry point anyway; --plugin is not needed.
[project.entry-points.ocrmypdf]
ocrmypdf_rapidocr_plugin = "ocrmypdf_rapidocr.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
