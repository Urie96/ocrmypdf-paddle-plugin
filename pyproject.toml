[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmypdf-paddleocr"
version = "0.2.0"
description = "PaddleOCR (PP-OCRv6 / PaddleOCR-VL) engine plugin for OCRmyPDF"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ocrmypdf-paddleocr contributors" }]
keywords = ["ocr", "ocrmypdf", "paddleocr", "pdf", "pp-ocrv6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "ocrmypdf>=14.0.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
# Recommended on CPU: 5-10x faster than paddle_static for PP-OCRv6.
onnxruntime = ["onnxruntime>=1.16"]
# Needed only for --paddle-engine vl.
vl = ["paddleocr[doc-parser]>=3.3"]

[project.urls]
# TODO: 改成你自己的仓库地址
Homepage = "https://github.com/USERNAME/ocrmypdf-paddle-plugin"
Issues = "https://github.com/USERNAME/ocrmypdf-paddle-plugin/issues"
Source = "https://github.com/clefru/ocrmypdf-paddleocr"

[project.entry-points.ocrmypdf]
paddleocr = "ocrmypdf_paddleocr.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
